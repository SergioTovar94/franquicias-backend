version: '3.8'

services:
  app:
    build: .
    container_name: franquicias-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://${NEON_HOST}:5432/neondb?sslmode=require
      - SPRING_R2DBC_USERNAME=${NEON_USER}
      - SPRING_R2DBC_PASSWORD=${NEON_PASSWORD}